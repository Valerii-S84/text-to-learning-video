[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "anna-local-media-generator"
version = "0.1.0"
description = "Text to Learning Video: a local multilingual learning-audio and karaoke-video generator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "openai>=2,<3",
  "PySide6>=6.8,<7",
  "pydantic-settings>=2.7,<3",
  "rapidfuzz>=3,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

# Ukrainian text and intentional typographic punctuation are valid in this project.
allowed-confusables = ["ʼ", "І", "А", "Н", "У", "а", "б", "е", "о", "р", "с", "у", "і", "–", "’", "−"]
